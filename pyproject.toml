[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quillfolio"
version = "1.0.0"
description = "Local CLI that renders the operator's own resume."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Madsvs123"}]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
quillfolio = "quillfolio.cli:console_main"

[tool.setuptools]
packages = ["quillfolio"]

[tool.setuptools.package-data]
quillfolio = ["print.css", "resume.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
